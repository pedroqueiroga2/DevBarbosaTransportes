<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@100..800&display=swap" rel="stylesheet">
   <link rel="stylesheet" href="style.css">

   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" integrity="sha512-Fo3rlrZj/k7ujTnHg4CGR2D7kSs0v4LLanw2qksYuRlEzO+tcaEPQogQ0KaoGN26/zrn20ImR1DfuLWnOo7aBA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
<title>Barbosa Transportes</title>
</head>
<body>
    <div class="bg-home">
        <header>

            <nav class="header-content container">
               <div class ="header-logo">
                <img src="assets/logo1-removebg-preview.png" alt="Logo Barbosa Transportes">

               </div>

               <div class="header-link1">
                <a  href="#">SOBRE</a>
                
               </div>
               <div class="header-link2">
                <a href="#">CONTATO</a>

               </div>

               <div class="header-icons">
                <a href="#">
                    <i class="fa-brands fa-instagram fa-2px"></i>
                </a>
                <a href="#">
                    <i class="fa-brands fa-facebook fa-2px"></i>
                </a>
                <a href="#">
                    <i class="fa fa-phone fa-2px"></i>
                </a>

                <div class="menu-icon " onclick="toggleMenu()">
                    <span id="icon-char">&#9776;</span>
                </div>
               


               </div>
            </nav>
             <ul class="mobile-menu" id="mobileMenu">
                    <li><a href="#">SOBRE</a></li>
                    <li><a href="#">CONTATO</a></li>
                </ul>

            <main class="hero container">
                <h1>Confie em quem está na estrada todos os dias</h1>
                <p>Seu frete merece cuidado, pontualidade e segurança.</p>
                
                <a href="#" class="button-contact" target="_blank">Realize seu agendamento!</a>
            </main>

        </header>
    </div>
</body>
<script>
    function toggleMenu()
    {

         document.getElementById("mobileMenu").classList.toggle("show");
        const iconChar = document.getElementById('icon-char')
        const menuIconContainer = document.querySelector('.menu-icon');

        if(iconChar.innerHTML.trim() == '☰')
        {
            iconChar.innerHTML = '×';
            menuIconContainer.classList.add('menu-opened');
        }
        else
        {
            iconChar.innerHTML = '☰';
            menuIconContainer.classList.remove('menu-opened');
        }
       
    }
</script>
</html>
